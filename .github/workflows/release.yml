name: Release

# Al subir un tag (p. ej. git tag v1.0.0 && git push origin v1.0.0):
#  1. Pasa el linter y los tests
#  2. Construye la imagen Docker de la API y la publica en GitHub Container Registry (GHCR)
#  3. Crea una GitHub Release con el CHANGELOG
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: flake8 src tests scripts run_pipeline.py
      - run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')-api
          docker build -t $IMAGE:${{ github.ref_name }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:latest

  release:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file CHANGELOG.md
